name: Paper engine checks

on:
  push:
    branches:
      - main
      - feature/sharkfunded-paper-risk-engine
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: pip install -r requirements.txt
      - name: Run paper risk and strategy tests
        run: python -m unittest backend.test_strategy_engine
      - name: Check dashboard JavaScript syntax
        run: node --check frontend/app.js
